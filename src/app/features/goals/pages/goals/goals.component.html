<h1 class="text-4xl font-bold mb-8">
  Goals
</h1>

<!-- Add Goal -->
<div class="dark:bg-slate-900 border border-slate-800 rounded-3xl p-6 mb-8">
  <div class="flex gap-4">
    <input type="text"
    [(ngModel)]="goalTitle"
    placeholder="Add study goal..."
    class="flex-1 bg-white dark:bg-slate-800 rounded-xl px-4 py-3 outline-none"/>
    <select [(ngModel)]="selectedPriority" class=" bg-white dark:bg-slate-800 rounded-xl px-4 py-3 ">
      <option value="high">
        High
      </option>
      <option value="medium">
        Medium
      </option>
      <option value="low">
        Low
      </option>
    </select>
    <button (click)="addGoal()" class="bg-green-500 px-6 rounded-xl font-semibold">
      Add
    </button>
  </div>
</div>

<!-- Goals List -->
<div class="space-y-4">
  @for(goal of goalsService.goals(); track goal.id) {
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:hover:bg-slate-800 rounded-2xl p-5 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <input
          type="checkbox"
          [checked]="goal.completed"
          (change)="goalsService.toggleGoal(goal.id)"
          class="w-5 h-5"/>
        <div>
          <h2
            class="text-xl"
            [class.line-through]="goal.completed">
            {{ goal.title }}
          </h2>
          <span
            class="px-3 py-1 rounded-full text-sm mt-2 inline-block"
            [ngClass]="{
              'bg-red-500': goal.priority === 'high',
              'bg-yellow-500': goal.priority === 'medium',
              'bg-green-500': goal.priority === 'low'
            }">
            {{ goal.priority }}
          </span>
        </div>
      </div>
      <button
        (click)="goalsService.deleteGoal(goal.id)"
        class="bg-red-500 px-4 py-2 rounded-lg">
        Delete
      </button>
    </div>
  }
</div>
